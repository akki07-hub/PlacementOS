<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Placement Readiness Report | PlacementOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #dbeafe;
      --text-dark: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --bg-subtle: #f8fafc;
      --success: #15803d;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background-color: #f1f5f9;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .print-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: 0 auto 1.5rem auto;
    }

    .btn-back {
      background: #ffffff;
      color: var(--text-dark);
      border: 1px solid var(--border);
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: #e2e8f0;
      color: var(--primary);
    }

    .btn-print {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-print:hover { background: #1e3a8a; }

    .report-paper {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 3rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 2rem;
    }

    .brand-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
    }

    .report-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .doc-meta {
      text-align: right;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .doc-meta strong { color: var(--text-dark); }

    .student-info-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 2rem;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .info-val {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .readiness-score-card {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
      border-radius: 12px;
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      page-break-inside: avoid;
    }

    .score-left {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .score-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1;
    }

    .score-max {
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .verdict-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .verdict-desc {
      font-size: 0.9rem;
      opacity: 0.9;
      max-width: 480px;
    }

    .status-badge {
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-header {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1rem;
      margin-top: 1.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1.5px solid var(--border);
      page-break-after: avoid;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2.5rem;
      page-break-inside: avoid;
    }

    .report-table th, .report-table td {
      padding: 0.85rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    .report-table th {
      background: var(--bg-subtle);
      font-weight: 700;
      color: var(--text-dark);
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .progress-bar-container {
      width: 140px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 2.5rem;
      page-break-inside: avoid;
    }

    .company-tier-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      background: var(--bg-subtle);
    }

    .company-tag {
      display: inline-block;
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 6px;
    }

    .accomplishments-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      page-break-inside: avoid;
    }

    @media print {
      body { background: #ffffff; padding: 0; }
      .print-controls { display: none !important; }
      .report-paper { box-shadow: none; border: none; padding: 0; max-width: 100%; }
      .readiness-score-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .status-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .progress-fill { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .report-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <!-- Top Action Bar -->
  <div class="print-controls">
    <a href="index.html#export" class="btn-back">← Back to PlacementOS</a>
    <button class="btn-print" onclick="window.print()">🖨️ Print / Save as PDF Report</button>
  </div>

  <!-- Printable Paper Document -->
  <div class="report-paper" id="report-paper-container">
    <!-- Hydrated dynamically from LocalStorage state -->
    <div style="text-align:center; padding: 2rem; color: var(--text-muted);">
      Loading Placement Readiness Report...
    </div>
  </div>

  <script type="module">
    import { StorageService } from './js/models/StorageService.js';
    import { ReadinessEngine } from './js/models/ReadinessEngine.js';
    import { RecommendationEngine } from './js/models/RecommendationEngine.js';
    import { ExportService } from './js/services/ExportService.js';

    document.addEventListener('DOMContentLoaded', () => {
      const state = StorageService.load() || {};
      const container = document.getElementById('report-paper-container');
      
      if (container && state) {
        container.innerHTML = ExportService.generateReportHTML(state);
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('autoprint') || urlParams.get('autoprint') === 'true') {
        setTimeout(() => {
          window.print();
        }, 500);
      }
    });
  </script>
</body>
</html>
